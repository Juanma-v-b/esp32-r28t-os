; ==========================================================
;  R28T OS - ESP32 + 2.8" ST7789 + XPT2046
;  PlatformIO / Arduino / LVGL 8
; ==========================================================
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; La app con LVGL + WiFi + HTTPS no cabe en la partición por defecto.
board_build.partitions = huge_app.csv
board_build.flash_mode = dio

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  -DLV_CONF_INCLUDE_SIMPLE
  ; Las librerías de .pio/libdeps no heredan el -Iinclude del proyecto,
  ; así que sin esto LVGL compila con su configuración por defecto
  ; (fuentes desactivadas, tick manual...).
  -Iinclude

  ; ---- TFT_eSPI: ST7789 240x320 (E32R28T) ----
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTFT_INVERSION_ON=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

lib_deps =
  lvgl/lvgl@8.4.0
  bodmer/TFT_eSPI@2.5.43
  bodmer/TJpg_Decoder@1.1.0
  bblanchon/ArduinoJson@7.2.1
